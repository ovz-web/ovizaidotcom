<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OVIZai — AI Video Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --bg-card:#141210;
    --bg-inset:#000000;
    --fg:#ece4d3;
    --muted:#8c8375;
    --muted-2:#5c564c;
    --gold:#caa243;
    --gold-bright:#f0c869;
    --gold-dim:#7a5f21;
    --border:rgba(236,228,211,.08);
    --border-strong:rgba(236,228,211,.16);
    --radius:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  ::selection{background:rgba(202,162,67,.25);color:var(--gold-bright);}

  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

  /* ambient texture */
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    opacity:.05;mix-blend-mode:overlay;
  }
  .aura{
    position:fixed;top:8%;left:50%;transform:translateX(-50%);
    width:520px;height:420px;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side, rgba(202,162,67,.22), rgba(202,162,67,0) 72%);
    filter:blur(10px);
  }

  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    background:rgba(11,10,8,.82);
    backdrop-filter:blur(10px);
  }
  .status{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.02);
    border:1px solid var(--border-strong);
    color:var(--fg);
    border-radius:999px;
    padding:6px 12px;
    font-size:11px;font-weight:500;letter-spacing:.03em;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .lang-btn:hover{border-color:rgba(202,162,67,.45);color:var(--gold-bright);}
  .lang-btn:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }
  .lang-btn svg{width:13px;height:13px;}

  main.hero{
    position:relative;z-index:2;
    max-width:440px;margin:0 auto;
    padding:56px 20px 40px;
  }

  .eyebrow{
    text-align:center;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold);
    margin:0 0 22px;
  }

  .logo-wrap{
    display:flex;justify-content:center;margin-bottom:20px;
  }
  .logo-wrap img{
    width:220px;max-width:72%;height:auto;
    filter:drop-shadow(0 14px 26px rgba(202,162,67,.16));
  }

  .mission{
    text-align:center;
    font-size:14.5px;line-height:1.55;
    color:var(--muted);
    max-width:340px;margin:0 auto 36px;
  }

  .card{
    border:1px solid var(--border-strong);
    background:var(--bg-card);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.7);
  }

  .search-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;border-bottom:1px solid var(--border);
    color:var(--muted);
    padding:15px 16px;
    font-size:13.5px;font-family:'Inter',sans-serif;
    cursor:pointer;text-align:left;
    transition:background .15s ease,color .15s ease;
  }
  .search-trigger:hover{background:rgba(255,255,255,.02);color:#b8b0a1;}
  .search-trigger svg{width:16px;height:16px;flex-shrink:0;color:var(--muted-2);}

  .command-list{display:flex;flex-direction:column;}
  .command-row{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    background:none;border:none;border-bottom:1px solid var(--border);
    padding:14px 16px;
    cursor:pointer;text-align:left;color:inherit;
    transition:background .15s ease;
  }
  .command-row:hover{background:rgba(255,255,255,.025);}
  .command-row:hover .cmd-title{color:var(--gold-bright);}
  .command-row:hover .cmd-icon{color:var(--gold-bright);}
  .cmd-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .cmd-icon{width:16px;height:16px;color:var(--gold);flex-shrink:0;transition:color .15s ease;}
  .cmd-text{display:flex;flex-direction:column;min-width:0;}
  .cmd-title{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    color:var(--fg);transition:color .15s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cmd-sub{font-size:11.5px;color:var(--muted-2);margin-top:2px;}
  .cmd-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .cmd-right kbd{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted-2);
  }
  .cmd-right .cmd-action{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
    display:none;
  }
  @media(min-width:420px){.cmd-right .cmd-action{display:inline;}}

  .block{border-bottom:1px solid var(--border);padding:16px;background:rgba(0,0,0,.16);}
  .nl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .nl-head .nl-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--fg);}
  .nl-desc{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 12px;}
  .nl-row{display:flex;gap:8px;}
  .nl-row input{
    width:100%;background:var(--bg-inset);border:1px solid var(--border-strong);
    border-radius:8px;padding:9px 11px;color:var(--fg);
    font-family:'IBM Plex Mono',monospace;font-size:12px;
  }
  .nl-row input::placeholder{color:var(--muted-2);}
  .nl-row input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .nl-btn{
    background:var(--fg);color:#0b0a08;border:none;border-radius:8px;
    padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;
    cursor:pointer;white-space:nowrap;transition:background .15s ease;
  }
  .nl-btn:hover{background:#fff;}
  .nl-btn[disabled]{opacity:.7;cursor:default;}
  .nl-success{
    display:flex;align-items:center;gap:8px;
    background:rgba(202,162,67,.1);border:1px solid rgba(202,162,67,.25);
    border-radius:8px;padding:9px 12px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold-bright);
  }
  .nl-success svg{width:14px;height:14px;flex-shrink:0;}

  .follow-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted-2);margin:0 0 10px;}
  .social-row{display:flex;align-items:center;gap:18px;}
  .social-row a{
    display:flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    text-decoration:none;transition:color .15s ease;
  }
  .social-row a:hover{color:var(--gold-bright);}
  .social-row svg{width:15px;height:15px;}

  .helper-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted-2);
  }

  footer{
    position:relative;z-index:2;
    max-width:440px;margin:0 auto;padding:26px 20px 48px;
    display:flex;flex-direction:column;gap:10px;align-items:center;
    border-top:1px solid var(--border);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted-2);
  }
  footer .foot-links{display:flex;gap:16px;}
  footer button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;}
  footer button:hover{color:var(--muted);}
  @media(min-width:480px){
    footer{flex-direction:row;justify-content:space-between;}
  }

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.82);backdrop-filter:blur(4px);
    display:flex;justify-content:center;align-items:flex-start;
    padding:96px 16px 16px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    width:100%;max-width:440px;
    background:var(--bg-card);border:1px solid var(--border-strong);
    border-radius:14px;padding:8px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8);
  }
  .modal-search{
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--border);padding:8px 10px 12px;
  }
  .modal-search svg{width:15px;height:15px;color:var(--muted-2);flex-shrink:0;}
  .modal-search input{
    flex:1;background:none;border:none;color:var(--fg);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  }
  .modal-search input:focus-visible{outline:none;}
  .modal-search kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted-2);}
  .modal-list{padding:6px 0;}
  .modal-row{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;border-radius:8px;
    padding:9px 10px;cursor:pointer;text-align:left;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#c9c1b3;
    transition:background .12s ease,color .12s ease;
  }
  .modal-row:hover{background:rgba(202,162,67,.1);color:var(--gold-bright);}
  .modal-row span:last-child{color:var(--muted-2);}
  .modal-empty{padding:16px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted-2);}

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:0;right:0;z-index:60;
    display:flex;justify-content:center;padding:0 16px;
  }
  .toast[hidden]{display:none;}
  .toast-inner{
    border:1px solid rgba(202,162,67,.3);background:rgba(0,0,0,.92);
    border-radius:999px;padding:8px 16px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-bright);
    box-shadow:0 20px 40px -10px rgba(0,0,0,.6);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

          '</div>' +
        '</div>' +
        '<div class="cmd-right">' +
          '<kbd>'+MOD_KEY+cmd.key+'</kbd>' +
          '<span class="cmd-action">'+cmd.action+'</span>' +
        '</div>';
      row.addEventListener("click", ()=>handleCommand(cmd));
      commandListEl.appendChild(row);
    });
  }

  function renderModalList(filter){
    const q = (filter||"").trim().toLowerCase();
    const items = t().commands.filter(c =>
      !q || c.title.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q)
    );
    modalListEl.innerHTML = "";
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "modal-empty";
      empty.textContent = "—";
      modalListEl.appendChild(empty);
      return;
    }
    items.forEach(cmd=>{
      const row = document.createElement("button");
      row.type = "button";
      row.className = "modal-row";
      row.innerHTML = '<span>'+cmd.title+'</span><span>'+cmd.action+'</span>';
      row.addEventListener("click", ()=>{ closeModal(); handleCommand(cmd); });
      modalListEl.appendChild(row);
    });
  }

  function handleCommand(cmd){
    if (cmd.type === "contact"){
      showToast(t().toastContact);
      setTimeout(()=>{ window.location.href = "mailto:contact@ovizai.com?subject=" + encodeURIComponent(cmd.title); }, 350);
    } else if (cmd.type === "resources"){
      showToast(t().toastResources);
      document.querySelector(".block").scrollIntoView({behavior:"smooth", block:"center"});
    }
  }

  let toastTimer;
  function showToast(msg){
    clearTimeout(toastTimer);
    toastInner.textContent = msg;
    toastEl.hidden = false;
    toastTimer = setTimeout(()=>{ toastEl.hidden = true; }, 2200);
  }

  function openModal(){
    modalOpen = true;
    modalOverlay.hidden = false;
    modalInput.value = "";
    renderModalList("");
    setTimeout(()=>modalInput.focus(), 30);
  }
  function closeModal(){
    modalOpen = false;
    modalOverlay.hidden = true;
  }

  el("searchTrigger").addEventListener("click", openModal);
  modalOverlay.addEventListener("click", (e)=>{ if(e.target === modalOverlay) closeModal(); });
  modalInput.addEventListener("input", (e)=>renderModalList(e.target.value));

  document.addEventListener("keydown", (e)=>{
    const mod = IS_MAC ? e.metaKey : e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k"){
      e.preventDefault();
      modalOpen ? closeModal() : openModal();
    } else if (e.key === "Escape"){
      closeModal();
    }
  });

  el("langToggle").addEventListener("click", ()=>{
    lang = lang === "en" ? "fr" : "en";
    renderText();
    renderCommands();
    if (modalOpen) renderModalList(modalInput.value);
  });

  el("nlForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    const email = el("nlEmail").value;
    if (!email.includes("@")) return;
    const btn = el("nlBtn");
    btn.disabled = true;
    btn.textContent = "…";
    setTimeout(()=>{
      el("nlForm").hidden = true;
      el("nlSuccess").hidden = false;
    }, 700);
  });

  document.querySelectorAll(".foot-links button").forEach((btn)=>{
    btn.addEventListener("click", ()=>showToast(btn.textContent));
  });

  renderText();
  renderCommands();
})();
</script>
</body>
</html>
